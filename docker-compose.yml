services:
  agentlens:
    image: agentlens:0.1.1
    build: .
    ports:
      - "127.0.0.1:${AGENTLENS_PUBLISHED_PORT:-8000}:8000"
    volumes:
      - agentlens-data:/data
    environment:
      - AGENTLENS_HOST=0.0.0.0
      - AGENTLENS_PORT=8000
      - AGENTLENS_DATA_DIR=/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health').read()"
        ]
      interval: 5s
      timeout: 5s
      retries: 3
    labels:
      - "com.agentlens.version=0.1.1"

volumes:
  agentlens-data:
