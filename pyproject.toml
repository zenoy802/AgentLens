[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "agentlens"
version = "1.0.0"
description = "SQL-first LLM trajectory visualization and annotation workbench."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy>=2.0",
  "pydantic>=2",
  "pydantic-settings",
  "alembic",
  "sqlparse",
  "cryptography",
  "httpx",
  "pymysql",
  "python-multipart",
  "loguru",
  "apscheduler",
  "openpyxl",
  "tiktoken",
  "click",
  "rich",
]

[project.scripts]
agentlens = "agentlens_cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = [
  "backend/app",
  "cli/agentlens_cli",
  "packages/agentlens-client/agentlens_client",
]

[tool.hatch.build.targets.wheel.force-include]
"backend/alembic" = "alembic"
"backend/alembic.ini" = "alembic.ini"

[tool.hatch.build.targets.sdist]
include = [
  "/backend/app",
  "/backend/alembic",
  "/backend/alembic.ini",
  "/cli/agentlens_cli",
  "/packages/agentlens-client/agentlens_client",
  "/README.md",
]
